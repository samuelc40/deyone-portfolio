<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Detail | Dion Dominic</title>
    <script>
        (function() {
            try {
                const saved = localStorage.getItem('deyone_portfolio_theme');
                if (saved) {
                    const theme = JSON.parse(saved);
                    const root = document.documentElement;
                    for (const [key, value] of Object.entries(theme.variables)) {
                        root.style.setProperty(key, value);
                    }
                    root.className = 'theme-' + theme.id;
                }
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=24">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <header class="header" style="position: fixed; background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px);">
        <div class="logo">
            <a href="index.html" style="text-decoration: none;">
                <h1 style="color: #ffffff;">DION DOMINIC</h1>
                <span>PHOTOJOURNALIST & FILMMAKER</span>
            </a>
        </div>
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle Menu">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <nav class="nav">
            <a href="index.html">&larr; BACK TO PORTFOLIO</a>
        </nav>
    </header>

    <main id="film-detail-container" style="">
        <!-- JS will populate film details here -->
        <div style="text-align: center; color: #fff; padding: 4rem;">Loading film...</div>
    </main>

    <!-- Lightbox Modal for Full Image View -->
    <div id="lightbox" class="lightbox-modal">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img" alt="">
        <div id="lightbox-caption"></div>
    </div>

    <script src="script.js?v=22"></script>
</body>
</html>

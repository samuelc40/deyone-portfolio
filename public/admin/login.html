<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Dion Dominic</title>
    <script>
        (function() {
            try {
                const saved = localStorage.getItem('deyone_portfolio_theme');
                if (saved) {
                    const theme = JSON.parse(saved);
                    const root = document.documentElement;
                    for (const [key, value] of Object.entries(theme.variables)) {
                        root.style.setProperty(key, value);
                    }
                    root.className = 'theme-' + theme.id;
                }
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <link rel="icon" type="image/png" href="../favicon.png">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, rgba(15, 15, 15, 0.98) 0%, rgba(5, 5, 5, 1) 90%);
        }

        .login-card {
            background: rgba(18, 18, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 3rem 2.5rem;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .login-logo {
            font-family: var(--font-body);
            font-size: 1.1rem;
            letter-spacing: 5px;
            font-weight: 500;
            color: #fff;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
        }

        .login-logo-sub {
            font-size: 0.65rem;
            letter-spacing: 6px;
            color: var(--color-text-muted);
            text-transform: uppercase;
            display: block;
            margin-bottom: 3rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--color-accent);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            background: rgba(30, 30, 30, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0.8rem 1rem;
            border-radius: 4px;
            font-family: var(--font-body);
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--color-accent);
            background: rgba(40, 40, 40, 0.7);
        }

        .login-btn {
            width: 100%;
            background: transparent;
            color: #fff;
            border: 1px solid var(--color-accent);
            padding: 0.9rem;
            border-radius: 4px;
            font-family: var(--font-body);
            font-size: 0.75rem;
            letter-spacing: 3px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1.5rem;
            text-transform: uppercase;
        }

        .login-btn:hover {
            background: var(--color-accent);
            color: #000;
        }

        .error-msg {
            color: #e57373;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            display: none;
            text-align: left;
            border-left: 2px solid #e57373;
            padding-left: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">Dion Dominic</div>
        <span class="login-logo-sub">Photojournalist</span>
        
        <div id="errorBox" class="error-msg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="login-btn">Log In</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');

            errorBox.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    sessionStorage.setItem('admin_secure_session', 'true');
                    window.location.href = './index.html';
                } else {
                    errorBox.textContent = data.error || 'Login failed';
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.textContent = 'Connection error. Please try again.';
                errorBox.style.display = 'block';
            }
        });

        // Kill any existing session when visiting login page for maximum security
        fetch('/api/auth/logout', { method: 'POST' });
        sessionStorage.removeItem('admin_secure_session');
    </script>
</body>
</html>

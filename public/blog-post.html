<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post | Dion Dominic</title>
    <script>
        (function() {
            try {
                const saved = localStorage.getItem('deyone_portfolio_theme');
                if (saved) {
                    const theme = JSON.parse(saved);
                    const root = document.documentElement;
                    for (const [key, value] of Object.entries(theme.variables)) {
                        root.style.setProperty(key, value);
                    }
                    root.className = 'theme-' + theme.id;
                }
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        .post-container {
            max-width: 800px;
            margin: 0 auto 8rem auto;
            padding: 0 4rem;
        }

        .post-header {
            margin-top: 4rem;
            margin-bottom: 4rem;
        }

        .post-meta {
            color: var(--color-accent);
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            display: block;
        }

        .post-title {
            font-family: var(--font-heading);
            font-size: 3rem;
            color: #fff;
            line-height: 1.1;
            font-weight: 400;
            margin: 0;
        }

        .post-body {
            color: #ddd;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .post-body p {
            margin-bottom: 2rem;
        }

        .post-body blockquote {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            color: var(--color-accent);
            border-left: 2px solid var(--color-accent);
            padding-left: 2rem;
            margin: 3rem 0;
            line-height: 1.4;
        }

        .post-image {
            margin: 4rem 0;
            border-radius: 4px;
            overflow: hidden;
            width: 100%;
        }

        .post-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .post-image-caption {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            margin-top: 0.8rem;
            text-align: center;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .post-container {
                padding: 0 2rem;
            }
            .post-title {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <header class="header" style="position: fixed; background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px);">
        <div class="logo">
            <a href="index.html" style="text-decoration: none;">
                <h1 style="color: #ffffff;">DION DOMINIC</h1>
                <span>PHOTOJOURNALIST</span>
            </a>
        </div>
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle Menu">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <nav class="nav">
            <a href="blog.html">&larr; BACK TO BLOG</a>
        </nav>
    </header>

    <main>
        <section class="story-hero" style="height: 60vh; position: relative; display: flex; align-items: flex-end; padding: 4rem;">
            <div id="post-hero-bg" style="position: absolute; top:0; left:0; width:100%; height:100%; background-position: center; background-size: cover; background-repeat: no-repeat; filter: brightness(0.4); z-index: -2;"></div>
            <div style="position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(to top, #0a0a0a 0%, transparent 80%); z-index: -1;"></div>
            
            <div class="fade-in-up" style="max-width: 800px;">
                <span class="post-meta" id="post-category-date">Loading...</span>
                <h1 class="post-title" id="post-title-main">Blog Post</h1>
            </div>
        </section>

        <article class="post-container fade-in-up">
            <div class="post-body" id="post-content-body" style="word-wrap: break-word; overflow-wrap: break-word; word-break: break-word;">
                <p>Loading article content...</p>
            </div>

            <section class="next-story fade-in-up" style="padding: 6rem 0 2rem 0; text-align: center; border-top: 1px solid #1a1a1a; margin-top: 6rem;">
                <span class="eyebrow">READ MORE</span>
                <h2 style="font-family: var(--font-heading); font-size: 2.2rem; color: #fff; margin-bottom: 2rem;"><a id="next-post-link" href="blog.html" style="color: #fff; text-decoration: none;">Explore other field notes &rarr;</a></h2>
                <a href="blog.html" class="btn btn-outline">RETURN TO BLOG</a>
            </section>
        </article>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const blogId = urlParams.get('id');

            if (!blogId) {
                window.location.href = 'blog.html';
                return;
            }

            fetch(`/api/blogs/${blogId}`)
                .then(res => {
                    if (!res.ok) throw new Error('Post not found');
                    return res.json();
                })
                .then(blog => {
                    document.title = `${blog.title} | Dion Dominic`;
                    document.getElementById('post-category-date').textContent = `${blog.date} • ${blog.category}`;
                    document.getElementById('post-title-main').textContent = blog.title;
                    
                    const ext = blog.image.split('.').pop().toLowerCase();
                    const isVideo = ['mp4', 'webm', 'ogg', 'mov'].includes(ext);
                    const heroBg = document.getElementById('post-hero-bg');
                    const mediaUrl = blog.image.startsWith('http') || blog.image.startsWith('/') ? blog.image : `assets/images/${blog.image}`;
                    
                    if (isVideo) {
                        heroBg.style.backgroundImage = 'none';
                        heroBg.innerHTML = `
                            <video autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover;">
                                <source src="${mediaUrl}" type="video/mp4">
                            </video>
                        `;
                    } else {
                        heroBg.innerHTML = '';
                        heroBg.style.backgroundImage = `url('${mediaUrl}')`;
                    }
                    
                    const contentBody = document.getElementById('post-content-body');
                    const hasHTML = /<\/?[a-z][\s\S]*>/i.test(blog.content);
                    if (hasHTML) {
                        contentBody.innerHTML = blog.content;
                    } else {
                        contentBody.innerHTML = blog.content
                            .trim()
                            .split(/\n\s*\n/)
                            .map(para => `<p>${para.replace(/\n/g, '<br>')}</p>`)
                            .join('');
                    }

                    if (blog.gallery && blog.gallery.length > 0) {
                        let galleryHtml = '<div class="masonry-gallery" style="margin-top: 4rem; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">';
                        blog.gallery.forEach((media, idx) => {
                            const url = media.src.startsWith('http') || media.src.startsWith('/') ? media.src : `assets/images/${media.src}`;
                            const isVideo = url.match(/\.(mp4|webm|ogg|mov)$/i);
                            const layoutClass = (idx % 3 === 2) ? 'wide' : '';
                            const inlineStyle = (idx % 3 === 2) ? 'grid-column: span 2;' : '';

                            galleryHtml += `<div class="masonry-item fade-in-up ${layoutClass}" style="${inlineStyle}">`;
                            if (isVideo) {
                                galleryHtml += `
                                    <video autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 4px;">
                                        <source src="${url}" type="video/mp4">
                                    </video>
                                `;
                            } else {
                                galleryHtml += `<img src="${url}" alt="Gallery image" style="width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 4px;">`;
                            }
                            galleryHtml += '</div>';
                        });
                        galleryHtml += '</div>';
                        contentBody.innerHTML += galleryHtml;
                    }
                    
                    if (window.setupAnimations) window.setupAnimations();

                    // Load next post link dynamically
                    fetch('/api/blogs')
                        .then(r => r.json())
                        .then(blogs => {
                            const currentIdx = blogs.findIndex(b => b.id === blogId);
                            const nextIdx = (currentIdx + 1) % blogs.length;
                            if (blogs[nextIdx] && blogs[nextIdx].id !== blogId) {
                                const nextLink = document.getElementById('next-post-link');
                                nextLink.href = `blog-post.html?id=${blogs[nextIdx].id}`;
                                nextLink.innerHTML = `${blogs[nextIdx].title} &rarr;`;
                            }
                        });
                })
                .catch(err => {
                    console.error('Error loading post', err);
                    document.getElementById('post-content-body').innerHTML = '<p>Unable to load article. The post may have been moved or deleted.</p>';
                });
        });
    </script>
    <script src="script.js?v=22"></script>
</body>
</html>
